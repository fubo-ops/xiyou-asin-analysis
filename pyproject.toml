[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xiyou-asin-analysis"
version = "0.1.0"
description = "Traceable Amazon multi-ASIN diagnostic Agent Skill"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1,<4", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"
